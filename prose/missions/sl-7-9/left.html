<p class="innerhtml-from-cms-underline mb-1">On Tuesday, January 2 at 7:44 p.m. PT, Falcon 9 launched 21 Starlink satellites to low-Earth orbit from Space Launch Complex 4 East (SLC-4E) at Vandenberg Space Force Base in California.</p>
<p class="innerhtml-from-cms-underline mb-1">This was the first flight for the first stage booster supporting this mission.</p>
