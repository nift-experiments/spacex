<p class="innerhtml-from-cms-underline mb-1">On Sunday, April 30 at 8:26 p.m. ET, Falcon Heavy launched the ViaSat-3 Americas mission, delivering the ViaSat-3 Americas, Astranis's first MicroGEO satellite, and Gravity Space’s GS-1 satellite to a geostationary orbit from Launch Complex 39A (LC-39A) at Kennedy Space Center in Florida. </p>
