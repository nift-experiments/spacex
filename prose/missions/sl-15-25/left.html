<p class="innerhtml-from-cms-underline mb-1">SpaceX’s Falcon 9 is targeting the launch of 27 <a href="https://www.starlink.com/" target="_">Starlink</a> satellites to low-Earth orbit from Space Launch Complex 4 East (SLC-4E) at Vandenberg Space Force Base in California.</p>
<p class="innerhtml-from-cms-underline mb-1">A live webcast of this mission will begin about 10 minutes prior to liftoff, which you can watch here and on <a href="https://twitter.com/SpaceX" target="_">X @SpaceX</a>. </p>
