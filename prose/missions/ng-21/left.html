<p class="innerhtml-from-cms-underline mb-1">On Sunday, August 4 at 11:02 a.m. ET, Falcon 9 launched Northrop Grumman’s 21st Commercial Resupply Services mission (<a href="https://sxcontent9668.azureedge.us/cms-assets/assets/Cygnus_NG_21_39587aaf02.png" target="_">NG-21</a>) to the International Space Station from Space Complex 40 (SLC-40) at Cape Canaveral Space Force Station in Florida. </p>
