<p class="innerhtml-from-cms-underline mb-1">On Friday, May 11 at 4:14 p.m. ET, Falcon 9 launched the Bangabandhu Satellite-1 mission to geostationary transfer orbit from Launch Complex 39A (LC-39A) at Kennedy Space Center in Florida.</p>
<p class="innerhtml-from-cms-underline mb-1">This was the first flight for the first stage booster supporting this mission.</p>
