<p class="innerhtml-from-cms-underline mb-1">On Friday, February 21 at 10:19 a.m. ET, Falcon 9 launched 23 <a href="https://www.starlink.com/" target="_">Starlink</a> satellites, including 13 with <a href="https://direct.starlink.com/" target="_">Direct to Cell</a> capabilities, to low-Earth orbit from Space Launch Complex 40 (SLC-40) at Cape Canaveral Space Force Station in Florida.</p>
