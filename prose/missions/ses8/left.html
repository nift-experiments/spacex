<p class="innerhtml-from-cms-underline mb-1">On Monday, December 3 at 5:41 p.m. ET, Falcon 9 launched the <a href="https://sxcontent9668.azureedge.us/cms-assets/assets/SES_8_patch_451ef29014.png" target="_"> SES-8 </a> mission to geosynchronous transfer orbit from Space Launch Complex 40 (SLC-40) at Cape Canaveral Air Force Station in Florida. This was SpaceX’s first mission to geosynchronous transfer orbit. </p>
