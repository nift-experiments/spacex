<p class="innerhtml-from-cms-underline mb-1">On Tuesday, June 4 at 7:16 p.m. ET, Falcon 9 launched 20 <a href="https://www.starlink.com/" target="_">Starlink</a> satellites, including 13 with <a href="https://direct.starlink.com/" target="_">Direct to Cell</a> capabilities, to low-Earth orbit from Space Launch Complex 40 (SLC-40) at Cape Canaveral Space Force Station in Florida.</p>
