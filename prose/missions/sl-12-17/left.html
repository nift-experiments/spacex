<p class="innerhtml-from-cms-underline mb-1">On Saturday, April 12 at 8:53 p.m. ET, Falcon 9 launched 21 <a href="https://www.starlink.com/" target="_">Starlink</a> satellites, including 13 with <a href="https://direct.starlink.com/" target="_">Direct to Cell</a> capabilities, to low-Earth orbit from Launch Complex 39A (LC-39A) at NASA’s Kennedy Space Center in Florida.</p>
