<p class="innerhtml-from-cms-underline mb-1">On Friday, September 20 at 6:50 a.m. PT, Falcon 9 launched 20 <a href="https://www.starlink.com/" target="_">Starlink</a> satellites, including 13 with <a href="https://direct.starlink.com/" target="_">Direct to Cell</a> capabilities, to low-Earth orbit from Space Launch Complex 4 East (SLC-4E) at Vandenberg Space Force Base in California.            </p>
