<p class="innerhtml-from-cms-underline mb-1">On Thursday, December 9 at 1:00 a.m. EST, Falcon 9 launched NASA’s Imaging X-ray Polarimetry Explorer (IXPE) to low Earth orbit from historic Launch Complex 39A (LC-39A) at NASA’s Kennedy Space Center in Florida. This was the fifth flight for NASA’s Launch Service Program.</p>
