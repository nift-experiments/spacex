<p class="innerhtml-from-cms-underline mb-1">On Saturday, March 19 at 12:42 a.m. ET, Falcon 9 launched 53 Starlink satellites to low-Earth orbit from Space Launch Complex 40 (SLC-40) at Cape Canaveral Space Force Station in Florida, completing the first twelfth launch and landing of an orbital class rocket booster.</p>
