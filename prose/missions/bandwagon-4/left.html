<p class="innerhtml-from-cms-underline mb-1">On Sunday, November 2 at 1:09 a.m. ET, Falcon 9 launched the <a href= https://sxcontent9668.azureedge.us/cms-assets/assets/Bandwagon_Y2_1_7ac9d38ded.png target="_">Bandwagon-4</a> mission to orbit from Space Launch Complex 40 (SLC-40) at Cape Canaveral Space Force Station in Florida. On board this mission were 18 payloads for KOREA ADD, Exolaunch, Fergani, Tomorrow Companies Inc., Starcloud, and Vast.</p>
