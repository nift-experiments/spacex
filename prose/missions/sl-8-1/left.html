<p class="innerhtml-from-cms-underline mb-1">On Saturday, April 6 at 7:25 p.m. PT, Falcon 9 launched 21 <a href="https://www.starlink.com/" target="_">Starlink</a> satellites, including six with <a href="https://www.starlink.com/business/direct-to-cell" target="_">Direct to Cell</a> capabilities, to low-Earth orbit from Space Launch Complex 4 East (SLC-4E) at Vandenberg Space Force Base in California.</p>
