<p class="innerhtml-from-cms-underline mb-1">On Sunday, December 23 at 8:51 a.m. ET, Falcon 9 launched the United States first Air Force's Global Positioning System III Space Vehicle 01 (GPS III SV01) to medium-Earth orbit from Space Launch Complex 40 (SLC-40) at Cape Canaveral Air Force Station in Florida.</p>
