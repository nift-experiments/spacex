<p class="innerhtml-from-cms-underline mb-1">On Sunday, May 9 at 2:42 a.m. EDT, Falcon 9 launched 60 Starlink satellites from Space Launch Complex 40 (SLC-40) at Cape Canaveral Space Force Station in Florida. After stage separation, Falcon 9’s first stage returned to Earth and landed on the “Just Read the Instructions” droneship.</p>
