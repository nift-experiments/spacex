<p class="innerhtml-from-cms-underline mb-1">Transporter-14 was a <a href="@path('public/rideshare/')" target="_">dedicated smallsat rideshare mission</a>. There were 70 payloads on this flight, including cubesats, microsats, re-entry capsules, and orbital transfer vehicles carrying three of those payloads to be deployed at a later time.</p>
