<p class="innerhtml-from-cms-underline mb-1">This was the seventh flight for the first stage booster supporting this mission, which previously launched KF-01, IMAP, NROL-77, GPS III-9, CRS-34, and one Starlink mission. Following stage separation, the first stage landed on Landing Zone 2 (LZ-2) at Cape Canaveral Space Force Station.</p>
