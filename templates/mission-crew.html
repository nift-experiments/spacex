@if(mission.astronauts){<div class="astronauts-wrapper"><div><h4 class="astronaut-title">Mission Crew</h4></div><div class="astronaut-cards-wrapper">@for(person : mission.astronauts){<div class="astronaut-card">@if(person.bioDisplayLink){<a href="$[person.bioDisplayLink]" target="_blank">}@if(person.portraitPath){<img class="astronaut-image" loading="lazy" src="@path('$[person.portraitPath]')">}@if(person.bioDisplayLink){</a><a href="$[person.bioDisplayLink]" target="_blank">}<span class="astronaut-name">$[person.name]</span>@if(person.bioDisplayLink){</a>}<span class="astronaut-description">@if(person.description){$[person.description]}</span></div>}</div></div>}
