<section class="sx-section" id="$[section.id]"><div class="section">
<span class="image-wrapper $[section.gradient]"></span>
@if(section.desktopVideo){<span class="video-wrapper full-video"><video aria-hidden="true" autoplay muted loop playsinline preload="auto" poster="@path('$[section.desktopImage]')" @if(section.mobileVideo){data-mobile="@path('$[section.mobileVideo]')"}><source type="video/mp4" src="@path('$[section.desktopVideo]')"></video></span>}else{<picture><source media="(max-width:961px)" srcset="@path('$[section.mobileImage]')"><img class="background-img" src="@path('$[section.desktopImage]')" alt=""></picture>}
<div class="section-inner @if(section.hero){full-height}else{full-height}"><div data-desktop-alignment="$[section.alignment]" class="$[section.alignment] @if(section.hero){hero}"><h2>$[section.title]</h2><p class="section-description">$[section.description]</p><div class="buttons"><span class="sx-button"><a class="spx-button primary" href="@if(section.external){$[section.link]}else{@path('$[section.link]')}" @if(section.newTab){target="_blank" rel="noopener noreferrer"} style="padding-left:20px;padding-right:20px;margin-top:30px"><div class="text">$[section.cta]</div><div class="arrow icon slide">@input('templates/arrow.html')</div></a></span></div></div></div></div></section>

@if(section.id == 'section-0'){@input('templates/home-upcoming.html')}
