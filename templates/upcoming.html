@for(launch : upcoming.items){<hr class="divider"><div class="sx-upcoming-card"><a class="card" href="@path('$[launch.route]')"><div class="card-content"><img loading="lazy" src="@path('$[launch.image]')" alt=""><div><span class="title">$[launch.title]</span><span class="countdown" data-mission-timing="$[launch.timingKey]">$[launch.timeLabel]</span></div></div><span class="button">@input('templates/arrow.html')</span></a></div>}
<hr class="divider"><a class="footer" href="@path('launches/')"><span class="footer-text">All upcoming launches</span><span class="icon">@input('templates/arrow.html')</span></a>
