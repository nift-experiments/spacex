@for(item : playlist.items){<a class="playlist-item-container native-playlist-link" data-sx="content-player-page" href="@path('$[item.route]')"><div class="playlist-item" data-sx="content-player-page"><video aria-hidden="true" data-sx="content-player-page" poster="@path('$[item.poster]')" preload="none"></video><div class="playlist-item-details" data-sx="content-player-page"><span data-sx="content-player-page">$[item.title]</span><span class="video-duration" data-sx="content-player-page">$[item.duration]</span></div></div></a>}
