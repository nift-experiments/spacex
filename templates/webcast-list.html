@for(webcast : mission.webcasts){@if(loop.length > 1){@if(loop.first){<div class="webcast-wrapper"><div class="webcast-header"><h2>Webcast</h2></div>}<div class="webcast-content"><img loading="lazy" @if(webcast.desktopPath){src="@path('$[webcast.desktopPath]')"} @if(webcast.mobilePath){data-mobile="@path('$[webcast.mobilePath]')"}><div class="webcast-info"><span class="webcast-title">$[webcast.title]</span>@if(webcast.dateLabel){<span class="webcast-date">$[webcast.dateLabel]</span>}</div>@if(webcast.supportedType){<span class="sx-button"><a class="spx-button primary" tabindex="0" role="button" aria-label="Watch $[webcast.title]" data-webcast-index="$[webcast.nativeIndex]" style="padding-left:20px;padding-right:20px;margin-top:0"><div class="arrow icon slide">@input('templates/arrow.html')</div></a></span>}</div>@if(loop.last){</div>}}}
